server:
  port: ${SERVER_PORT:${PORT:8100}}
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  config:
    activate:
      on-profile: prod
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5671}
    username: ${RABBITMQ_USER:${RABBITMQ_USERNAME:}}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:true}
      verify-hostname: ${RABBITMQ_SSL_VERIFY_HOSTNAME:true}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:styleradar1@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    rabbit:
      enabled: false
    mail:
      enabled: false
    # Redis es obligatorio (OTP, sesiones y límite de solicitudes): el health refleja si responde.
    redis:
      enabled: true
styleradar:
  usuarios:
    base-url: ${USUARIOS_SERVICE_URL:https://styleradar-usuarios-prod.azurewebsites.net}
    username: ${USUARIOS_INTERNAL_USERNAME:ms-auth}
    password: ${USUARIOS_INTERNAL_PASSWORD:}
    dev-fallback-enabled: false

  tiendas:
    base-url: ${TIENDAS_API_BASE_URL:${TIENDAS_SERVICE_URL:${TIENDAS_BASE_URL:}}}
    internal-username: ${TIENDAS_INTERNAL_USERNAME:ms-auth}
    internal-password: ${TIENDAS_INTERNAL_PASSWORD:${AUTH_INTERNAL_PASSWORD:}}

  mail:
    dev-console-fallback-enabled: false

  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      duration: ${JWT_DURATION:PT8H}
    otp:
      ttl-seconds: 300
      max-attempts: 3
      max-resends: 3
      lockout-seconds: ${OTP_LOCKOUT_SECONDS:60}
      session-ttl-seconds: ${OTP_SESSION_TTL_SECONDS:900}
    oauth2:
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
        redirect-uri: ${GOOGLE_REDIRECT_URI:https://styleradar-auth-prod.azurewebsites.net/api/v1/auth/oauth2/google/callback}
        allowed-redirect-uris: ${GOOGLE_ALLOWED_REDIRECT_URIS:https://styleradar-auth-prod.azurewebsites.net/api/v1/auth/oauth2/google/callback,https://styleradar.com/auth/google/callback}
    redis-local-fallback-enabled: false
    rate-limit:
      enabled: true
      max-requests: ${RATE_LIMIT_MAX_REQUESTS:15}
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://styleradar.com,https://*.styleradar.com}

