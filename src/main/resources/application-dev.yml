spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

styleradar:
  usuarios:
    base-url: ${USUARIOS_SERVICE_URL:http://localhost:8120}
    username: ${USUARIOS_INTERNAL_USERNAME:ms-auth}
    password: ${USUARIOS_INTERNAL_PASSWORD:}

  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      duration: ${JWT_DURATION:PT24H}
    otp:
      ttl-seconds: 300
      max-attempts: 3

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}