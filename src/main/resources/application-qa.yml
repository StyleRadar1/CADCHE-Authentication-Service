server:
  port: ${PORT:${SERVER_PORT:8100}}
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  config:
    activate:
      on-profile: qa
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

  rabbitmq:
    host: ${RABBITMQ_HOST:styleradar-rabbitmq-qa.northcentralus.cloudapp.azure.com}
    port: ${RABBITMQ_PORT:5671}
    username: ${RABBITMQ_USER:${RABBITMQ_USERNAME:}}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:true}
      verify-hostname: ${RABBITMQ_SSL_VERIFY_HOSTNAME:true}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:styleradar1@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    rabbit:
      enabled: false
    mail:
      enabled: false
    redis:
      enabled: false
styleradar:
  usuarios:
    base-url: ${USUARIOS_QA_SERVICE_URL:https://styleradar-usuarios-qa.azurewebsites.net}
    username: ${USUARIOS_INTERNAL_USERNAME:ms-auth}
    password: ${USUARIOS_INTERNAL_PASSWORD:}
    dev-fallback-enabled: ${USUARIOS_DEV_FALLBACK_ENABLED:false}

  mail:
    dev-console-fallback-enabled: ${MAIL_DEV_CONSOLE_FALLBACK_ENABLED:false}

  security:
    jwt:
      secret-base64: ${JWT_SECRET_QA_BASE64}
      duration: ${JWT_DURATION:PT12H}
    otp:
      ttl-seconds: 300
      max-attempts: 3
      max-resends: 3
      lockout-seconds: ${OTP_LOCKOUT_SECONDS:60}
      session-ttl-seconds: ${OTP_SESSION_TTL_SECONDS:900}
    oauth2:
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
        redirect-uri: ${GOOGLE_REDIRECT_URI:https://styleradar-auth-qa.azurewebsites.net/api/v1/auth/oauth2/google/callback}
        allowed-redirect-uris: ${GOOGLE_ALLOWED_REDIRECT_URIS:https://styleradar-auth-qa.azurewebsites.net/api/v1/auth/oauth2/google/callback,https://qa.styleradar.com/auth/google/callback}
    redis-local-fallback-enabled: false
    registration:
      stub-enabled: false
    rate-limit:
      enabled: true
      max-requests: ${RATE_LIMIT_MAX_REQUESTS:15}
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

  cors:
    allowed-origins: ${CORS_QA_ALLOWED_ORIGINS:https://qa.styleradar.com,https://*.styleradar.com,https://*.azurewebsites.net}

