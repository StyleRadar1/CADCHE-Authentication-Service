server:
  port: ${SERVER_PORT:${PORT:8100}}
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  config:
    activate:
      on-profile: qa

  datasource:
    url: ${DB_URL:jdbc:postgresql://styleradar-pg-qa.postgres.database.azure.com:5432/styleradar_auth?sslmode=require}
    username: ${DB_USERNAME:styleradaradmin}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5671}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:true}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

styleradar:
  usuarios:
    base-url: ${USUARIOS_SERVICE_URL:https://styleradar-usuarios-qa.azurewebsites.net}
    username: ${USUARIOS_INTERNAL_USERNAME}
    password: ${USUARIOS_INTERNAL_PASSWORD}
    dev-fallback-enabled: false

  mail:
    dev-console-fallback-enabled: false

  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      duration: ${JWT_DURATION:PT12H}
    otp:
      ttl-seconds: 300
      max-attempts: 3
      max-resends: 3
    oauth2:
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
        redirect-uri: ${GOOGLE_REDIRECT_URI:https://styleradar-auth-qa.azurewebsites.net/api/v1/auth/oauth2/google/callback}
        allowed-redirect-uris: ${GOOGLE_ALLOWED_REDIRECT_URIS:https://styleradar-auth-qa.azurewebsites.net/api/v1/auth/oauth2/google/callback,https://qa.styleradar.com/auth/google/callback}
    redis-local-fallback-enabled: false
    registration:
      stub-enabled: false
    rate-limit:
      enabled: true
      max-requests: ${RATE_LIMIT_MAX_REQUESTS:15}
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://qa.styleradar.com,https://*.styleradar.com,https://*.azurewebsites.net}

