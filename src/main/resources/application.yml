server:
  port: ${PORT:${SERVER_PORT:8100}}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: ms-auth
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:${RABBITMQ_USERNAME:}}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:styleradar1@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    rabbit:
      enabled: false
    mail:
      enabled: false
    redis:
      enabled: false
styleradar:
  usuarios:
    base-url: ${USUARIOS_QA_SERVICE_URL:https://styleradar-usuarios-qa.azurewebsites.net}
    oauth2-path: ${USUARIOS_OAUTH2_PATH:/internal/api/v1/users/oauth2}
    correo-verificado-path: ${USUARIOS_CORREO_VERIFICADO_PATH:/internal/api/v1/users/{id}/verify-email}
    correo-verificado-legacy-path: ${USUARIOS_CORREO_VERIFICADO_LEGACY_PATH:/api/v1/internal/usuarios/{id}/correo-verificado}
    credenciales-path: ${USUARIOS_CREDENCIALES_PATH:/internal/api/v1/users/verify-credentials}
    credenciales-legacy-path: ${USUARIOS_CREDENCIALES_LEGACY_PATH:/internal/api/v1/usuarios/verificar-credenciales}
    username: ${USUARIOS_INTERNAL_USERNAME:ms-auth}
    password: ${USUARIOS_INTERNAL_PASSWORD:}
    dev-fallback-enabled: false

  mail:
    dev-console-fallback-enabled: false

  security:
    jwt:
      secret-base64: ${JWT_SECRET_QA_BASE64:VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdTZWNyZXRLZXlGb3JUZXN0czEyMzQ1Ng==}
      duration: ${JWT_DURATION:PT24H}
    otp:
      ttl-seconds: 300
      max-attempts: 3
      max-resends: 3
      lockout-seconds: ${OTP_LOCKOUT_SECONDS:60}
      session-ttl-seconds: ${OTP_SESSION_TTL_SECONDS:900}
    oauth2:
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
        redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8100/api/v1/auth/oauth2/google/callback}
        allowed-redirect-uris: ${GOOGLE_ALLOWED_REDIRECT_URIS:http://localhost:8100/api/v1/auth/oauth2/google/callback,http://localhost:3000/auth/google/callback,https://styleradar.com/auth/google/callback}
        authorization-uri: ${GOOGLE_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
        token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
        jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
        state-ttl-seconds: ${GOOGLE_STATE_TTL_SECONDS:300}
    redis-local-fallback-enabled: false
    registration:
      stub-enabled: false
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      max-requests: ${RATE_LIMIT_MAX_REQUESTS:15}
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

  cors:
    allowed-origins: ${CORS_QA_ALLOWED_ORIGINS:https://styleradar.com,https://*.styleradar.com,https://*.azurewebsites.net,http://localhost:3000,http://localhost:5173,http://127.0.0.1:*}
