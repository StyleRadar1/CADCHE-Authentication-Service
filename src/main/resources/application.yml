server:
  port: ${SERVER_PORT:${PORT:8100}}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: ms-auth
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/styleradar_auth}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:${RABBITMQ_USERNAME:}}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

styleradar:
  usuarios:
    base-url: ${USUARIOS_SERVICE_URL:https://ms-usuarios-internal}
    oauth2-path: ${USUARIOS_OAUTH2_PATH:/internal/api/v1/usuarios/oauth2}
    username: ${USUARIOS_INTERNAL_USERNAME:}
    password: ${USUARIOS_INTERNAL_PASSWORD:}
    dev-fallback-enabled: false

  mail:
    dev-console-fallback-enabled: false

  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64:}
      duration: ${JWT_DURATION:PT24H}
    otp:
      ttl-seconds: 300
      max-attempts: 3
      max-resends: 3
    oauth2:
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
        redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8100/api/v1/auth/oauth2/google/callback}
        allowed-redirect-uris: ${GOOGLE_ALLOWED_REDIRECT_URIS:http://localhost:8100/api/v1/auth/oauth2/google/callback,http://localhost:3000/auth/google/callback,https://styleradar.com/auth/google/callback}
        authorization-uri: ${GOOGLE_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
        token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
        jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
        state-ttl-seconds: ${GOOGLE_STATE_TTL_SECONDS:300}
    redis-local-fallback-enabled: false
    registration:
      stub-enabled: false
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      max-requests: ${RATE_LIMIT_MAX_REQUESTS:15}
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://styleradar.com,https://*.styleradar.com,https://*.azurewebsites.net}
