services:
  ms-auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-auth
    ports:
      - "8100:8100"
    environment:
      SERVER_PORT: 8100
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      REDIS_HOST: auth-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-auth-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      USUARIOS_SERVICE_URL: ${USUARIOS_SERVICE_URL:-http://ms-usuarios:8120}
      USUARIOS_OAUTH2_PATH: ${USUARIOS_OAUTH2_PATH:-/api/v1/internal/users/oauth2}
      USUARIOS_INTERNAL_USERNAME: ${USUARIOS_INTERNAL_USERNAME:-ms-auth}
      USUARIOS_INTERNAL_PASSWORD: ${USUARIOS_INTERNAL_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8100/api/v1/auth/oauth2/google/callback}
      GOOGLE_ALLOWED_REDIRECT_URIS: ${GOOGLE_ALLOWED_REDIRECT_URIS:-http://localhost:8100/api/v1/auth/oauth2/google/callback,http://localhost:3000/auth/google/callback}
      GOOGLE_STATE_TTL_SECONDS: ${GOOGLE_STATE_TTL_SECONDS:-300}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-styleradar1@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      auth-redis:
        condition: service_healthy
      auth-rabbitmq:
        condition: service_healthy
    networks:
      - auth-network

  auth-redis:
    image: redis:7-alpine
    container_name: auth-redis
    ports:
      - "6379:6379"
    volumes:
      - auth-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auth-network

  auth-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: auth-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5673:5672"     # AMQP (5673 en el host para no chocar con el RabbitMQ de ms-tiendas)
      - "15673:15672"   # Consola de administración
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - auth-network

volumes:
  auth-redis-data:

networks:
  auth-network:
    driver: bridge
