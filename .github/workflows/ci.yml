name: CI/CD - Authentication Service

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Tests, Analisis Estatico y Sonar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: mvn -B clean verify --no-transfer-progress

      - name: Analisis estatico con SpotBugs
        run: >
          mvn -B
          com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:check
          "-Dspotbugs.excludeFilterFile=spotbugs-exclude.xml"

      - name: Analisis de codigo con SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN no configurado"
            exit 1
          fi

          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=StyleRadar1_CADCHE-Authentication-Service \
            -Dsonar.qualitygate.wait=true

      - name: Guardar reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-auth
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  docker-publish:
    name: Construir y publicar imagen Docker
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Definir etiquetas de imagen
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/styleradar-auth:${GITHUB_SHA}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$IMAGE" >> "$GITHUB_OUTPUT"
          echo "${DOCKERHUB_USERNAME}/styleradar-auth:test-latest" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-qa:
    name: Desplegar en Azure App Service QA
    needs: docker-publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar en QA
        uses: azure/webapps-deploy@v3
        with:
          app-name: styleradar-auth-qa
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_QA }}
          images: ${{ needs.docker-publish.outputs.image }}

  deploy-prod:
    name: Desplegar en Azure App Service PROD
    needs: docker-publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar en PROD
        uses: azure/webapps-deploy@v3
        with:
          app-name: styleradar-auth-prod
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          images: ${{ needs.docker-publish.outputs.image }}
