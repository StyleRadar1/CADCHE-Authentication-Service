name: CI/CD - Authentication Service

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Tests, Coverage and Sonar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run tests
        run: mvn -B clean verify --no-transfer-progress

      - name: SpotBugs analysis
        run: >
          mvn -B
          com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:check
          "-Dspotbugs.excludeFilterFile=spotbugs-exclude.xml"

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "ERROR: SONAR_TOKEN no está configurado."
            exit 1
          fi

          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=StyleRadar1_CADCHE-Authentication-Service \
            -Dsonar.qualitygate.wait=true

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-auth
          path: target/site/jacoco/
          retention-days: 14

  docker-publish:
    name: Build and publish Docker image
    needs: build-and-test
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' ||
       github.ref == 'refs/heads/main')

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Define Docker image tags
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ "$GITHUB_REF_NAME" = "develop" ]; then
            TAG="qa-latest"
          else
            TAG="prod-latest"
          fi

          IMAGE="${DOCKERHUB_USERNAME}/styleradar-auth:${TAG}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$IMAGE" >> "$GITHUB_OUTPUT"
          echo "${DOCKERHUB_USERNAME}/styleradar-auth:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-qa:
    name: Deploy to Azure QA
    needs: docker-publish
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'

    steps:
      - name: Deploy Authentication Service to QA
        uses: azure/webapps-deploy@v3
        with:
          app-name: styleradar-auth-qa
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_QA }}
          images: ${{ needs.docker-publish.outputs.image }}

  deploy-prod:
    name: Deploy to Azure PROD
    needs: docker-publish
    runs-on: ubuntu-latest

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Deploy Authentication Service to PROD
        uses: azure/webapps-deploy@v3
        with:
          app-name: styleradar-auth-prod
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          images: ${{ needs.docker-publish.outputs.image }}
