name: CI/CD - Authentication Service

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Tests, Analisis Estatico y Sonar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Configurar Java 21 Temurin
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: mvn -B clean verify --no-transfer-progress

      - name: Analisis estatico con SpotBugs
        run: >
          mvn -B
          com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:check
          "-Dspotbugs.excludeFilterFile=spotbugs-exclude.xml"

      - name: Analisis de codigo con SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN no configurado"
            exit 1
          fi

          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=StyleRadar1_CADCHE-Authentication-Service \
            -Dsonar.qualitygate.wait=true

      - name: Guardar reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-report-auth
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar SBOM CycloneDX
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-cyclone-dx-auth
          path: target/bom.*
          if-no-files-found: warn
          retention-days: 30

  docker-publish:
    name: Construir y publicar imagen Docker
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Descargar codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Definir etiquetas de imagen
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/styleradar-auth:${GITHUB_SHA}"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$IMAGE" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF" = "refs/heads/develop" ]; then
            echo "${DOCKERHUB_USERNAME}/styleradar-auth:qa-latest" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "${DOCKERHUB_USERNAME}/styleradar-auth:prod-latest" >> "$GITHUB_OUTPUT"
          fi

          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-qa:
    name: Desplegar en Azure App Service QA
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar en QA
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383
        with:
          app-name: styleradar-auth-qa
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_QA }}
          images: ${{ needs.docker-publish.outputs.image }}

  deploy-prod:
    name: Desplegar en Azure App Service PROD
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Desplegar en PROD
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383
        with:
          app-name: styleradar-auth-prod
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          images: ${{ needs.docker-publish.outputs.image }}
