# CI/CD QA: cada push a develop compila, prueba, publica la imagen y despliega en Azure QA.
name: CI/CD QA - Authentication Service

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build, Tests, Analisis Estatico y Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Configurar Java 21 Temurin
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar y ejecutar pruebas (JaCoCo >= 85% lineas / >= 80% ramas)
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify --no-transfer-progress

      - name: Guardar JAR validado para la imagen Docker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ms-auth-jar
          path: target/ms-auth-*.jar
          if-no-files-found: error
          retention-days: 1

      - name: Analisis estatico con SpotBugs
        run: >
          ./mvnw -B --no-transfer-progress
          com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:check
          "-Dspotbugs.excludeFilterFile=spotbugs-exclude.xml"

      - name: Analisis de codigo con SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN no configurado"
            exit 1
          fi

          ./mvnw -B --no-transfer-progress \
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=StyleRadar1_CADCHE-Authentication-Service \
            -Dsonar.qualitygate.wait=true

      - name: Resumen de cobertura JaCoCo
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F',' '
              NR > 1 {
                im += $4; ic += $5; bm += $6; bc += $7; lm += $8; lc += $9; mm += $12; mc += $13
              }
              END {
                it = im + ic; bt = bm + bc; lt = lm + lc; mt = mm + mc;
                printf "### Cobertura JaCoCo (ms-auth)\n\n"
                printf "| Métrica | Cubierto | Total | Porcentaje |\n"
                printf "| :--- | ---: | ---: | ---: |\n"
                if (it > 0) printf "| Instrucciones | %d | %d | %.2f%% |\n", ic, it, (100.0 * ic / it)
                if (bt > 0) printf "| Ramas (umbral >= 80%%) | %d | %d | %.2f%% |\n", bc, bt, (100.0 * bc / bt)
                if (lt > 0) printf "| Líneas (umbral >= 85%%) | %d | %d | %.2f%% |\n", lc, lt, (100.0 * lc / lt)
                if (mt > 0) printf "| Métodos | %d | %d | %.2f%% |\n", mc, mt, (100.0 * mc / mt)
                printf "\n- Reporte publicado en SonarCloud: https://sonarcloud.io/component_measures?id=StyleRadar1_CADCHE-Authentication-Service&metric=coverage\n"
              }
            ' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Cobertura JaCoCo: reporte no generado en target/site/jacoco/jacoco.csv" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-report-auth
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar SBOM CycloneDX
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-cyclone-dx-auth
          path: target/bom.*
          if-no-files-found: warn
          retention-days: 30

  docker-publish:
    name: Construir y publicar imagen Docker
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar codigo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Descargar JAR validado
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ms-auth-jar
          path: target

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Definir etiquetas de imagen
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/styleradar-auth:${GITHUB_SHA}"

          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$IMAGE" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "${DOCKERHUB_USERNAME}/styleradar-auth:prod-latest" >> "$GITHUB_OUTPUT"
          else
            echo "${DOCKERHUB_USERNAME}/styleradar-auth:qa-latest" >> "$GITHUB_OUTPUT"
            echo "${DOCKERHUB_USERNAME}/styleradar-auth:test-latest" >> "$GITHUB_OUTPUT"
            echo "${DOCKERHUB_USERNAME}/styleradar-auth:latest" >> "$GITHUB_OUTPUT"
          fi

          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-qa:
    name: Desplegar en Azure App Service QA
    needs: docker-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Desplegar en QA
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383
        with:
          app-name: styleradar-auth-qa
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_QA }}
          images: ${{ secrets.DOCKERHUB_USERNAME }}/styleradar-auth:${{ github.sha }}

      - name: Smoke Test - Verificacion Swagger OpenAPI y Health en QA
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_QA }}
        run: |
          API_URL="https://styleradar-auth-qa.azurewebsites.net/v3/api-docs"
          SWAGGER_URL="https://styleradar-auth-qa.azurewebsites.net/swagger-ui/index.html"
          HEALTH_URL="https://styleradar-auth-qa.azurewebsites.net/actuator/health"
          echo "Ejecutando Smoke Test contra: $API_URL, $SWAGGER_URL y $HEALTH_URL"
          # Espera a que App Service reemplace el contenedor anterior para no validar la versión vieja.
          sleep 90
          SEGUIDOS=0
          for i in $(seq 1 25); do
            STATUS_API=$(curl --max-time 15 -s -o /dev/null -w "%{http_code}" "$API_URL" || true)
            STATUS_SWAGGER=$(curl --max-time 15 -s -o /dev/null -w "%{http_code}" "$SWAGGER_URL" || true)
            STATUS_HEALTH=$(curl --max-time 15 -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
            echo "Intento $i: OpenAPI=$STATUS_API SwaggerUI=$STATUS_SWAGGER Health=$STATUS_HEALTH"
            if [ "$STATUS_API" = "200" ] && [ "$STATUS_SWAGGER" = "200" ] && [ "$STATUS_HEALTH" = "200" ]; then
              SEGUIDOS=$((SEGUIDOS + 1))
            else
              SEGUIDOS=0
            fi
            if [ "$SEGUIDOS" -ge 3 ]; then
              echo "Microservicio Auth QA desplegado y respondiendo 200 OK (OpenAPI, Swagger UI y Actuator Health)"
              exit 0
            fi
            sleep 12
          done
          python3 - << 'PY' || true
          import os, xml.etree.ElementTree as ET, urllib.request, base64, json, datetime
          hoy = datetime.datetime.now(datetime.timezone.utc).strftime("%Y_%m_%d")
          xml_data = os.environ.get("PUBLISH_PROFILE", "")
          if xml_data:
              root = ET.fromstring(xml_data)
              prof = root.find(".//publishProfile[@publishMethod='MSDeploy']") or root.find(".//publishProfile")
              if prof is not None:
                  u = prof.attrib.get("userName", "")
                  p = prof.attrib.get("userPWD", "")
                  auth = base64.b64encode(f"{u}:{p}".encode()).decode()
                  try:
                      req = urllib.request.Request("https://styleradar-auth-qa.scm.azurewebsites.net/api/logs/docker", headers={"Authorization": f"Basic {auth}"})
                      with urllib.request.urlopen(req, timeout=15) as r:
                          logs = json.loads(r.read().decode())
                          for item in logs:
                              href = item.get("href", "")
                              print("=== LOG:", item.get("machineName"), href)
                              if href and hoy in href:
                                  r2 = urllib.request.Request(href, headers={"Authorization": f"Basic {auth}"})
                                  with urllib.request.urlopen(r2, timeout=15) as lf:
                                      lines = lf.read().decode(errors="replace").splitlines()
                                      for line in lines[-80:]:
                                          print(line)
                  except Exception as e:
                      print("Logs err:", e)
          PY
          echo "Advertencia: La API tardo en iniciar o no respondio HTTP 200 (OpenAPI=$STATUS_API, SwaggerUI=$STATUS_SWAGGER, Health=$STATUS_HEALTH)"
          exit 1

